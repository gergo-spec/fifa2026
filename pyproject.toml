[project]
name = "meccsjoslo"
version = "0.1.0"
description = "LangGraph alapú meccsjósló – LLM (Gemini) jósolja egy WC-meccs kimenetét"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "langgraph>=0.2",
    "langchain-google-genai>=2.0",
    "langfuse>=4.9.1",
    "playwright>=1.60.0",
]

[project.scripts]
meccsjoslo = "meccsjoslo.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/meccsjoslo"]

[dependency-groups]
dev = [
    "pytest>=8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src"]
